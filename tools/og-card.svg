<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#d4e6ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ba4ff"/>
      <stop offset="1" stop-color="#4c97ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#4c97ff" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative scratch-style blocks, top-right -->
  <g opacity="0.5">
    <rect x="905" y="70"  width="230" height="52" rx="12" fill="#4c97ff"/>
    <rect x="935" y="132" width="200" height="52" rx="12" fill="#ffab19"/>
    <rect x="935" y="194" width="170" height="52" rx="12" fill="#9966ff"/>
    <rect x="905" y="256" width="230" height="52" rx="12" fill="#4cbf56"/>
  </g>

  <!-- wordmark -->
  <text x="90" y="250" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="118" font-weight="800" letter-spacing="-2">
    <tspan fill="#575e75">Scratch </tspan><tspan fill="#ffab19">GPT</tspan>
  </text>

  <!-- tagline -->
  <text x="92" y="330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="500" fill="#5b6580">
    Describe a program in plain English —
  </text>
  <text x="92" y="384" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="500" fill="#5b6580">
    get a valid Scratch <tspan font-weight="800" fill="#4c97ff">.sb3</tspan> project.
  </text>

  <!-- flow pills -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700">
    <g filter="url(#soft)">
      <rect x="92" y="452" width="250" height="82" rx="18" fill="#ffffff"/>
      <text x="217" y="502" text-anchor="middle" fill="#575e75">description</text>
    </g>
    <text x="366" y="503" font-size="40" fill="#9aa6c2">→</text>
    <g filter="url(#soft)">
      <rect x="424" y="452" width="150" height="82" rx="18" fill="#ffffff"/>
      <text x="499" y="502" text-anchor="middle" fill="#575e75">IR</text>
    </g>
    <text x="596" y="503" font-size="40" fill="#9aa6c2">→</text>
    <g filter="url(#soft)">
      <rect x="654" y="452" width="230" height="82" rx="18" fill="url(#blue)"/>
      <text x="769" y="502" text-anchor="middle" fill="#ffffff">.sb3 file</text>
    </g>
  </g>

  <!-- footer url -->
  <text x="92" y="590" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#8a93a8">scratchgpt.sankhacooray.com</text>
</svg>

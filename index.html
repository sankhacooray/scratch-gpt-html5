  <!-- Icons + PWA -->
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scratch GPT" />
  <script>
    // Saved theme choice applies before first paint; otherwise follow the system.
    try { var t = localStorage.getItem('sc-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <style>
    :root { --blue: #4c97ff; --ink: #575e75; --bg: #e8f1fc; --panel: #ffffff; --line: #d9e3f2; --muted: #8a93a8;
      --note: #9aa6c2; --track: #cfe0fb; --glow: rgba(76,151,255,0.18); color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --ink: #eef2fb; --bg: #141d33; --panel: #1e2a47; --line: #2f3e5e; --muted: #9aa6c2;
        --note: #7f8bab; --track: #2f3e5e; --glow: rgba(0,0,0,0.4); color-scheme: dark; }
    }
    :root[data-theme="dark"] { --ink: #eef2fb; --bg: #141d33; --panel: #1e2a47; --line: #2f3e5e; --muted: #9aa6c2;
      --note: #7f8bab; --track: #2f3e5e; --glow: rgba(0,0,0,0.4); color-scheme: dark; }
    * { box-sizing: border-box; }
    /* No overscroll bounce, no white edge. */
    html { height: 100%; overflow: hidden; background: var(--bg); overscroll-behavior: none; }
    body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { background: var(--bg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--ink); }

    /* The embedded Apps Script app fills the viewport. */
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }

    /* Gate overlay: shown until the iframe reports a successful load. If the app
       can't render in an iframe (visitor not signed into Google), this stays up
       with a button that opens the app top-level, where Google login works. */
    #gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: var(--bg); transition: opacity 0.3s; }
    #gate.hidden { opacity: 0; pointer-events: none; }
    .card { position: relative; max-width: 420px; text-align: center; background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; padding: 28px 26px; box-shadow: 0 8px 30px var(--glow); }
    .card img { width: 56px; height: 56px; }
    h1 { margin: 12px 0 4px; font-size: 22px; color: var(--ink); }
    h1 .gpt { color: #ffab19; }
    .sub { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
    .btn { display: inline-block; background: var(--blue); color: #fff; text-decoration: none; font-weight: 700;
      padding: 11px 20px; border-radius: 10px; font-size: 15px; }
    .btn:hover { filter: brightness(1.08); box-shadow: 0 4px 16px rgba(76,151,255,0.45); }
    .spinner { width: 22px; height: 22px; margin: 6px auto 14px; border: 3px solid var(--track); border-right-color: var(--blue);
      border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .note { margin-top: 14px; font-size: 12px; color: var(--note); }
    /* Theme switch: shows the NEXT theme (moon in light, sun in dark). */
    .theme { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center; background: transparent; border: 1px solid var(--line); color: var(--ink);
      cursor: pointer; transition: background-color .15s; }
    .theme:hover { background: var(--bg); }
    .theme svg { width: 16px; height: 16px; }
    .theme .sun { display: none; }
    :root[data-theme="dark"] .theme .sun { display: block; }
    :root[data-theme="dark"] .theme .moon { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme .sun { display: block; }
      :root:not([data-theme="light"]) .theme .moon { display: none; }
    }
    .loading-only .ready { display: none; }
    .ready-only .loading { display: none; }
  </style>
</head>
<body>
  <!-- Embedded gated app. Sign-in + allowlist are enforced inside (Apps Script). -->
  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbxwBKa62yQ58fSd9s2aJ62uQQqhLrB0RSDspCk0SU5TFpveb1qZTcxThcJxEWmYgott/exec"
    title="Scratch GPT"></iframe>

  <div id="gate" class="loading-only">
    <div class="card">
      <button class="theme" id="theme" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <img src="https://scratch.mit.edu/favicon.ico" alt="Scratch" />
      <h1>Scratch <span class="gpt">GPT</span></h1>
      <div class="loading">
        <div class="spinner"></div>
        <p class="sub">Opening the app…</p>
      </div>
      <div class="ready">
        <p class="sub">Sign in with any Google account to try the demo.</p>
      </div>
      <a class="btn" id="openTab"
        href="https://script.google.com/macros/s/AKfycbxwBKa62yQ58fSd9s2aJ62uQQqhLrB0RSDspCk0SU5TFpveb1qZTcxThcJxEWmYgott/exec"
        target="_blank" rel="noopener">Open Scratch GPT</a>
      <p class="note">If the app stays blank (you're not signed into Google, or third-party cookies are blocked), use the button above to open it in a new tab.</p>
    </div>
  </div>

  <script>
    (function () {
      var root = document.documentElement, btn = document.getElementById('theme');
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      function dark() { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : mq.matches; }
      function label() { var l = dark() ? 'Switch to light theme' : 'Switch to dark theme'; btn.title = l; btn.setAttribute('aria-label', l); }
      label();
      if (mq.addEventListener) mq.addEventListener('change', label);
      btn.addEventListener('click', function () {
        var next = dark() ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('sc-theme', next); } catch (e) {}
        label();
      });
    })();
    var gate = document.getElementById('gate');
    // Drop the overlay ONLY when the embedded app posts its "ready" signal.
    // We can't use the iframe's `load` event: it also fires for Google's
    // sign-in / authorization pages (which refuse to be framed), and would
    // hide the overlay over a blank frame for not-yet-authorized visitors.
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (d && d.source === 'scratch-gpt' && d.type === 'ready') {
        gate.classList.add('hidden');
      }
    });
    // If no "ready" arrives shortly (sign-in/authorization needed, which can't
    // happen in-frame), switch the overlay copy to the launch message — the
    // "Open Scratch GPT" button opens the app top-level, where Google login works.
    setTimeout(function () {
      if (!gate.classList.contains('hidden')) {
        gate.classList.remove('loading-only');
        gate.classList.add('ready-only');
      }
    }, 6000);
  </script>
  <script async src="https://sankhacooray.com/js/sankha-analytics.js" data-badge="off"></script>
</body>
</html>
